name: Auto-Start Caster.fm Server

on:
  schedule:
    # Runs daily at 08:00 UTC/GMT and 14:00 UTC/GMT (2:00 PM)
    - cron: '0 8,14 * * *'
  workflow_dispatch:

jobs:
  start-server:
    runs-on: ubuntu-latest
    steps:
      - name: Start Caster.fm Streaming Server
        env:
          TOKEN: ${{ secrets.CASTER_PRIVATE_TOKEN }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://caster.fm")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "Server started successfully."
          elif [ "$http_code" -eq 406 ]; then
            echo "Server is already booted and running."
          else
            echo "Failed to start server."
            exit 1
          fi
