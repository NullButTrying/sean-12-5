           - name: Auto-Start Caster.fm Server
        env:
          CASTER_EMAIL: ${{ secrets.CASTER_EMAIL }}
          CASTER_LOGIN_PASS: ${{ secrets.CASTER_LOGIN_PASS }}
        run: |
          python3 - << 'EOF'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("https://cloud.caster.fm/", timeout=60000)
              
              page.locator('input[type="email"], input[name="email"]').first.fill(os.environ["CASTER_EMAIL"])
              page.locator('input[type="password"], input[name="password"]').first.fill(os.environ["CASTER_LOGIN_PASS"])
              page.locator('button[type="submit"], input[type="submit"]').first.click()
              page.wait_for_timeout(6000)

              # Print current URL to confirm login succeeded
              print("Logged in, current page:", page.url)

              # Look for a Start Server button if the server is stopped
              start_btn = page.locator('button:has-text("Start"), a:has-text("Start")').first
              if start_btn.is_visible():
                  print("Server is off. Clicking Start...")
                  start_btn.click()
                  page.wait_for_timeout(8000)
              else:
                  print("Server is already running or Start button not found.")
              browser.close()
          EOF
